# Task15 诊断日志（默认关闭；./script/task15_diag.sh <run-name> 可临时开启）
diagnostics:
  enable: false
  output_dir: diagnostics/task15
  aimer_hz: 200.0
  gimbal_hz: 200.0
  event_cooldown_ms: 50.0
  car_roll_threshold_deg: 8.0
  car_pitch_threshold_deg: 8.0
  attitude_step_threshold_deg: 5.0
  cmd_yaw_jump_threshold_deg: 2.0
  cmd_pitch_jump_threshold_deg: 2.0
